<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Copiar e-mail para escolas | Projeto Imersão Azul</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:#e9eff1;color:#173448;font-family:Arial,Helvetica,sans-serif}
    .toolbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px max(18px,calc((100% - 980px)/2));background:#fff;border-bottom:1px solid #d5e0e3;box-shadow:0 4px 18px rgba(13,36,56,.08)}
    .intro strong{display:block;color:#0d2438;font-size:15px;line-height:20px}.intro span{display:block;color:#647986;font-size:12px;line-height:18px}
    .actions{display:flex;gap:10px;flex:0 0 auto}.btn{border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font:700 14px/20px Arial,sans-serif;background:#1a8fa0;color:#fff;box-shadow:0 5px 14px rgba(26,143,160,.2)}
    .btn.secondary{background:#0d2940}.btn.success{background:#25795d}.status{margin:15px auto;width:min(600px,calc(100% - 24px));min-height:21px;color:#526a78;font-size:13px;line-height:20px;text-align:center}
    .preview{display:block;margin:0 auto 32px;width:min(760px,calc(100% - 24px));height:2700px;border:0;border-radius:16px;background:#eaf1f3;box-shadow:0 12px 38px rgba(13,36,56,.12)}
    @media(max-width:760px){.toolbar{align-items:stretch;flex-direction:column}.actions{display:grid;grid-template-columns:1fr}.btn{width:100%}.preview{width:100%;border-radius:0}}
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="intro"><strong>E-mail para escolas · Currículo Azul</strong><span>Foto da escola, coleção, certificado e convite para apresentação.</span></div>
    <div class="actions">
      <button class="btn" id="copy-rich" type="button">Copiar e-mail formatado</button>
      <button class="btn secondary" id="copy-html" type="button">Copiar HTML para o HighLevel</button>
    </div>
  </div>
  <p class="status" id="status">Assunto sugerido: <strong>Prepare sua escola para o futuro da educação oceânica</strong></p>
  <iframe class="preview" id="preview" title="Prévia do e-mail para escolas" src="email-escolas-curriculo-azul.html"></iframe>
  <script>
    const sourceUrl='email-escolas-curriculo-azul.html';
    const richButton=document.getElementById('copy-rich');
    const htmlButton=document.getElementById('copy-html');
    const preview=document.getElementById('preview');
    const status=document.getElementById('status');
    let source='';
    fetch(sourceUrl,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(html=>{source=html;status.innerHTML='E-mail carregado: <strong>foto da escola, coleção, certificado e fechamento comercial</strong>.'}).catch(()=>{status.textContent='Não foi possível carregar o HTML. Atualize a página e tente novamente.'});
    function feedback(button,label,original){button.textContent=label;button.classList.add('success');setTimeout(()=>{button.textContent=original;button.classList.remove('success')},2200)}
    async function copyHtml(){
      if(!source){status.textContent='O HTML ainda está carregando. Tente novamente em alguns segundos.';return}
      try{await navigator.clipboard.writeText(source);feedback(htmlButton,'HTML copiado ✓','Copiar HTML para o HighLevel')}
      catch(e){const area=document.createElement('textarea');area.value=source;document.body.appendChild(area);area.select();document.execCommand('copy');area.remove();feedback(htmlButton,'HTML copiado ✓','Copiar HTML para o HighLevel')}
    }
    async function copyRich(){
      const doc=preview.contentDocument;
      if(!doc||!doc.body){status.textContent='A prévia ainda está carregando. Tente novamente em alguns segundos.';return}
      const html=doc.documentElement.outerHTML;
      const plain=doc.body.innerText;
      try{
        if(window.ClipboardItem&&navigator.clipboard.write){await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([plain],{type:'text/plain'})})])}
        else{const range=doc.createRange();range.selectNodeContents(doc.body);const selection=doc.getSelection();selection.removeAllRanges();selection.addRange(range);doc.execCommand('copy');selection.removeAllRanges()}
        feedback(richButton,'E-mail copiado ✓','Copiar e-mail formatado')
      }catch(e){status.textContent='Seu navegador bloqueou a cópia formatada. Use o botão de HTML para o HighLevel.'}
    }
    htmlButton.addEventListener('click',copyHtml);richButton.addEventListener('click',copyRich);
  </script>
</body>
</html>
